name: Feature request
description: Propose an API, platform, performance, or documentation improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what you are trying to do and where the library falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Include a Swift API example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing approaches and their limitations.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and additional context
      description: Mention affected platforms, dependency requirements, or changes to existing APIs.
