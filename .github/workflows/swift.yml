name: Swift
on: [push, pull_request]
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run supertonic 'Hello world.' sample.wav en F1 /tmp/models
      - run: SUPERTONIC_TEST_MODELS=/tmp/models swift test
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift run supertonic 'Hello world.' sample.wav en F1 "$RUNNER_TEMP/models"
      - run: SUPERTONIC_TEST_MODELS="$RUNNER_TEMP/models" swift test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target Supertonic --triple arm64-apple-ios15.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
